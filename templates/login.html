{% extends 'base.html' %}
{% load static %}

{% block title %}Welcome - BF Travel{% endblock %}

{% block content %}
<div class="min-h-screen relative flex items-center justify-center">
    <!-- Background -->
    <div class="fixed inset-0 z-0">
        <img src="{% static 'images/mountain.jpg' %}" alt="Background" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-white/30 backdrop-blur-md"></div>
    </div>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-sm mx-4">
        <div class="bg-white/80 backdrop-blur-md rounded-3xl shadow-xl p-8 border border-white/50">
            <!-- Title -->
            <div class="text-center mb-8">
                <h1 style="font-family: 'Cormorant Garamond', serif;" class="text-4xl font-semibold text-orange-900">
                    Welcome Back
                </h1>
                <p class="text-orange-700/60 text-sm mt-2">The adventure continues...</p>
            </div>

            <!-- Form -->
            <form method="post" class="space-y-5">
                {% csrf_token %}

                {% if form.errors %}
                <div class="bg-red-50/80 text-red-700 text-sm rounded-xl p-3 text-center">
                    Invalid username or password
                </div>
                {% endif %}

                <div>
                    <input type="text" name="username" placeholder="Username" required
                        class="w-full px-4 py-3 bg-white/70 rounded-xl border border-orange-200/50 text-orange-900 placeholder-orange-400/50 focus:outline-none focus:ring-2 focus:ring-orange-300/50 focus:border-transparent transition-all">
                </div>

                <div>
                    <input type="password" name="password" placeholder="Password" required
                        class="w-full px-4 py-3 bg-white/70 rounded-xl border border-orange-200/50 text-orange-900 placeholder-orange-400/50 focus:outline-none focus:ring-2 focus:ring-orange-300/50 focus:border-transparent transition-all">
                </div>

                <button type="submit" style="font-family: 'Cormorant Garamond', serif;"
                    class="w-full py-3 bg-orange-100/90 text-orange-800 rounded-xl hover:bg-orange-200/90 transition-all text-lg border border-orange-300/40 shadow-sm hover:shadow-md">
                    Login
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
